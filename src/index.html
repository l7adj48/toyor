<!doctype html>
<html lang="ar" dir="rtl" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#09090b" />
    <meta name="color-scheme" content="dark" />
    <title>NutriFit DZ — تغذية رياضية محسوبة بالغرام</title>
    <meta
      name="description"
      content="NutriFit DZ: حاسبة احتياج غذائي شفافة، بناء وجبات بالغرام وتوزيعها على اليوم، فاتورة مفصّلة، وجورنال لمتابعة الوزن والتطور."
    />
    <meta property="og:title" content="NutriFit DZ — تغذية محسوبة بالغرام" />
    <meta
      property="og:description"
      content="من قياساتك إلى طبق موزون: احتياج محسوب، وجبات موزونة، وفاتورة شفافة تفصل المكونات عن أجر الخدمة."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <style>
      #nf-boot {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background:
          radial-gradient(120% 70% at 50% 0%, #17150f 0%, rgba(9, 9, 11, 0) 62%),
          #09090b;
        color: #f3f1ec;
        font-family: Tahoma, 'Segoe UI', -apple-system, BlinkMacSystemFont, Arial, sans-serif;
        text-align: center;
      }
      .nf-boot-box {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        max-width: 380px;
        width: 100%;
      }
      .nf-boot-ring {
        width: 76px;
        height: 76px;
        border-radius: 50%;
        background: conic-gradient(from 0deg, rgba(200, 169, 110, 0) 0deg, #c8a96e 300deg, #e6d1a3 360deg);
        -webkit-mask: radial-gradient(farthest-side, rgba(0, 0, 0, 0) calc(100% - 7px), #000 calc(100% - 6px));
        mask: radial-gradient(farthest-side, rgba(0, 0, 0, 0) calc(100% - 7px), #000 calc(100% - 6px));
        animation: nfBootSpin 1.05s linear infinite;
      }
      @keyframes nfBootSpin {
        to {
          transform: rotate(360deg);
        }
      }
      .nf-boot-brand {
        font-size: 11px;
        letter-spacing: 0.24em;
        color: #c8a96e;
        font-weight: 700;
      }
      .nf-boot-title {
        font-size: 18px;
        font-weight: 700;
        margin: 0;
        line-height: 1.5;
      }
      .nf-boot-detail {
        font-size: 12px;
        line-height: 1.9;
        color: #96938a;
        margin: 0;
      }
      .nf-boot-hint {
        font-size: 11px;
        line-height: 1.9;
        color: #66645e;
        margin: 0;
        opacity: 0;
        animation: nfBootHint 400ms ease-out 6s forwards;
      }
      @keyframes nfBootHint {
        to {
          opacity: 1;
        }
      }
      .nf-boot-btn {
        min-height: 46px;
        width: 100%;
        padding: 12px 18px;
        border-radius: 12px;
        border: 0;
        cursor: pointer;
        font-family: inherit;
        font-size: 13px;
        font-weight: 700;
        color: #141108;
        background: linear-gradient(to left, #e6d1a3, #c8a96e);
      }
      .nf-boot-btn-ghost {
        color: #96938a;
        background: #18181c;
        border: 1px solid #232329;
      }
      .nf-boot-noscript {
        max-width: 420px;
        margin: 0 auto;
        padding: 16px;
        border-radius: 14px;
        border: 1px solid #b86157;
        background: #1a1111;
        color: #f3f1ec;
        font-size: 13px;
        line-height: 2;
      }
      @media (prefers-reduced-motion: reduce) {
        .nf-boot-ring {
          animation-duration: 3s;
        }
        .nf-boot-hint {
          animation-delay: 1s;
        }
      }
    </style>
  </head>
  <body class="bg-[#09090b] text-[#f3f1ec] antialiased selection:bg-[#c8a96e]/25 selection:text-[#f3f1ec]">
    <div id="root"></div>

    <div id="nf-boot" role="status" aria-live="polite">
      <div class="nf-boot-box">
        <div class="nf-boot-ring" aria-hidden="true"></div>
        <div class="nf-boot-brand">NUTRIFIT DZ</div>
        <h1 class="nf-boot-title">جارٍ تهيئة مساحتك الغذائية</h1>
        <p class="nf-boot-detail">نحمّل الحاسبة العلمية وقائمة المكونات وسجل تطورك.</p>
        <p class="nf-boot-hint">
          إن بقيت هذه الشاشة، فالملفات لم تُحمَّل. افتح التطبيق من رابط الخدمة في متصفح حديث
          (Chrome أو Firefox أو Safari) بدل محرر النصوص، ثم أعد التحميل.
        </p>
      </div>
    </div>

    <noscript>
      <div class="nf-boot-noscript">
        هذا التطبيق يحتاج JavaScript ليعمل. فعّل JavaScript في المتصفح ثم أعد تحميل الصفحة.
      </div>
    </noscript>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
